name: fetch-media
# Downloads generated media listed in scripts/media/urls.txt ("<url> <path>" per line) and commits it.
on:
  push:
    branches: [ccr-6651a26a-t4gy2p]
    paths: ['scripts/media/urls.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set -e
          while read -r url dest; do
            [ -z "$url" ] && continue
            case "$url" in \#*) continue;; esac
            [ -f "$dest" ] && continue
            mkdir -p "$(dirname "$dest")"
            curl -fsSL --retry 3 -A "Mozilla/5.0" "$url" -o "$dest" && echo "ok $dest $(stat -c%s "$dest")" || echo "FAIL $url"
            case "$dest" in *.zip) unzip -o -q "$dest" -d "$(dirname "$dest")" && rm "$dest";; esac
          done < scripts/media/urls.txt
      - name: Commit
        run: |
          git config user.name "media-bot"; git config user.email "media-bot@users.noreply.github.com"
          git add -A media-raw audit-raw assets || true
          git commit -m "media: fetched generated assets" || exit 0
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep 5; done
