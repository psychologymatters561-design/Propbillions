name: deploy
on:
  push:
    branches: [main, ccr-6651a26a-t4gy2p]
    paths-ignore: ['audit-raw/**', 'media-raw/**', 'docs/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: deploy-${{ github.ref_name }}, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Pages settings (for the record)
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages | tee pages-info.json | head -40
      - run: npm ci
      - run: npm test
      - name: Build
        env:
          SITE_URL: https://psychologymatters561-design.github.io
          BASE_PATH: /Propbillions
        run: npm run build && touch dist/.nojekyll && node scripts/copy-gate.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - name: Publish build to the gh-pages branch (works with branch-based Pages)
        if: github.ref_name == 'main'
        run: |
          cd dist
          git init -q -b gh-pages && git config user.name "deploy-bot" && git config user.email "deploy-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Deploy ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
  deploy:
    if: github.ref_name == 'main'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
        continue-on-error: true
